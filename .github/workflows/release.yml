# Workflow публичного зеркала github.com/sanke46/feedbay-mcp.
# Тег vX.Y.Z приходит из монорепо (scripts/sync-mcp-mirror.sh) → установщик
# для Claude Desktop в GitHub Releases и пакет в npm с provenance.
#
# Установщик выходит первым и не зависит от npm: кнопка в кабинете FeedBay
# ведёт на releases/latest/download/feedbay.mcpb, и пока npm-организации нет,
# она обязана работать. npm публикуется, только когда задан NPM_TOKEN.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Claude Desktop bundle
        run: npm run pack:mcpb

      - name: GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("out/feedbay-$VERSION.mcpb" "out/feedbay.mcpb")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            awk "/^## $VERSION/{found=1; next} /^## /{if(found) exit} found" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" "${assets[@]}" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set – skipping npm publish; the release and the installer are out."
            exit 0
          fi
          npm publish --provenance --access public
